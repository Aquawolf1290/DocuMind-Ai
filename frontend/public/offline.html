<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090f" />
    <title>DocuMind AI Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(34, 211, 238, 0.18), transparent 42%), #08090f;
        color: #eef2ff;
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        width: min(520px, calc(100vw - 32px));
        border: 1px solid rgba(190, 205, 255, 0.18);
        border-radius: 12px;
        background: rgba(17, 19, 31, 0.82);
        padding: 28px;
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
      }
      h1 { margin: 0 0 10px; }
      p { margin: 0; color: #9aa7bd; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>DocuMind AI is offline</h1>
      <p>The app shell is installed, but document intelligence needs the local API connection. Start the backend and reconnect to continue processing documents.</p>
    </main>
  </body>
</html>
