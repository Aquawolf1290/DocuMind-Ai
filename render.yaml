services:
  - type: web
    name: documind-ai-api
    env: docker
    rootDir: backend
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: documind-storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
